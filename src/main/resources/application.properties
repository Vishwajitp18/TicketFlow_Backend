spring.application.name=TicketFlow
server.servlet.context-path=/api/v1

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=150000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Belt-and-suspenders alongside TimeZone.setDefault(UTC) in main() — tells Hibernate to bind/
# read timestamps against the JDBC driver in UTC explicitly, rather than relying on the JVM
# default (which we do also pin, but this removes any doubt).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Creates the ShedLock table (schema.sql) on every startup — it's not a JPA entity so
# Hibernate's ddl-auto never creates it, and CREATE TABLE IF NOT EXISTS makes this idempotent.
spring.sql.init.mode=always

spring.jackson.time-zone=UTC
springdoc.api-docs.enabled=true

# JWT
jwt.access.secret=${JWT_ACCESS_SECRET}
jwt.access.expiry=600000
jwt.refresh.secret=${JWT_REFRESH_SECRET}
jwt.refresh.expiry=15552000000
jwt.refresh.hash.key=${JWT_REFRESH_HASH_KEY}

# Session / booking / waitlist business logic
session.count.max=3
booking.hold.ttl-minutes=${BOOKING_HOLD_TTL_MINUTES:10}
waitlist.offer.ttl-minutes=${WAITLIST_OFFER_TTL_MINUTES:15}
waitlist.accumulation-timeout-minutes=${WAITLIST_ACCUMULATION_TIMEOUT_MINUTES:60}

# Email (Brevo)
brevo.api-key=${BREVO_API_KEY}
ticketflow.email.from.email=${EMAIL_FROM_ADDRESS:noreply@livo.works}
ticketflow.email.from.name=${EMAIL_FROM_NAME:Livo}

# Base URL used to build the waitlist-offer "accept" link embedded in emails
ticketflow.app.base-url=${APP_BASE_URL:http://localhost:3000}

# Bootstrap admin (only used on first startup if no admin exists yet)
ticketflow.admin.email=${ADMIN_EMAIL:}
ticketflow.admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
