# PRODUCTION — all values come from platform env vars (Render/Railway dashboard), never from this file.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Swagger UI/OpenAPI generation reflectively scans every controller and DTO at startup,
# adding real metaspace + heap overhead that isn't worth it on a 512MB-constrained instance —
# it's a docs convenience, not something prod traffic needs.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
