services:
  - type: web
    name: ticketflow-api
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Using an external Supabase Postgres instead of a Render-managed database —
      # use the session pooler (port 5432), not the transaction pooler (6543): Hibernate
      # relies on server-side prepared statements, which PgBouncer transaction-mode pooling
      # (the 6543 endpoint) breaks unless disabled.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # No SPRING_JPA_HIBERNATE_DDL_AUTO override here anymore — the schema was already
      # created against this same Supabase DB during the first deploy, so this service
      # (recreated in a new region, pointed at the same DB) can go straight to the safer
      # default from application-prod.properties: ddl-auto=validate.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_HASH_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: noreply@ticketflow.app
      - key: EMAIL_FROM_NAME
        value: TicketFlow
      - key: APP_BASE_URL
        value: https://ticketflow-api.onrender.com/api/v1
      - key: BOOKING_HOLD_TTL_MINUTES
        value: "10"
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: "15"
      - key: WAITLIST_ACCUMULATION_TIMEOUT_MINUTES
        value: "60"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
