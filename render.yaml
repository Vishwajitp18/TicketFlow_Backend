databases:
  - name: ticketflow-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: ticketflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflow-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: ticketflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ticketflow-db
          property: password
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_HASH_KEY
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: noreply@ticketflow.app
      - key: EMAIL_FROM_NAME
        value: TicketFlow
      - key: APP_BASE_URL
        value: https://ticketflow-api.onrender.com/api/v1
      - key: BOOKING_HOLD_TTL_MINUTES
        value: "10"
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: "15"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
